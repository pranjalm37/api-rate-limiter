name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The image is the documented way to run this, so a broken Dockerfile
      # should fail CI rather than be discovered by whoever clones the repo.
      - name: Build image
        run: docker build -t api-rate-limiter:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name rl -p 8000:8000 api-rate-limiter:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "container healthy"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs rl
          exit 1
